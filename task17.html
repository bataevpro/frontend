<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
      <title>Фигуры</title>
    <style>
   /* Серый главный прямоугольник */
.main-container {
         background-color: gray;
         width: 700px;
         height: 550px;
         padding: 20px;
         box-sizing: border-box;
  
  /* Делаем сам контейнер флексбоксом, чтобы ряды шли друг за другом по вертикали */
         display: flex;
         flex-direction: column;
         justify-content: space-between; /* Равномерно распределяет верх, середину и низ */
}

/* Базовые стили для рядов */
.row {
         display: flex;
         gap: 20px;
         margin-bottom: 20px;
}
.vertical-group {
         display: flex;
        flex-direction: column;
         gap: 30px;  
         margin-right: 40px;
}
/* Стили для маленьких квадратов */

.squarebig {
         width: 500px;
         height: 210px;
         background-color: purple;
}


 .square1 {

          width: 90px;
          height: 90px;
          background-color: orange;
          
        }
    .square2 {

          width: 90px;
          height: 90px;
          background-color: orange;
          
        }
    .square3 {
         width: 150px;
         height: 70px;
         background-color: green;
}
     .square4 {
         width: 150px;
         height: 70px;
         background-color: green;
}

     .square5 {
         width: 150px;
         height: 70px;
         background-color: green;
}
     .square6 {
         width: 60px;
         height: 60px;
         background-color: blue;
}


        
/* ВЕРХНИЙ РЯД: раздвигаем два квадрата по углам */
.row-top {
          justify-content: space-between;
}

/* СРЕДНИЙ РЯД: элемент один, растягиваем его */
.row-middle {
          justify-content: space-around;
}

/* Растянутый прямоугольник в середине */
.rect {
          width: 90%; /* Занимает большую часть ширины */
          height: 80px;
          background-color: pink;
}

/* НИЖНИЙ РЯД: распределяем три квадрата (по углам и в центре) */
.row-bottom {
         justify-content: center;
}
</style>
</head>
<body>
  <div class="main-container">
     <div class="row row-top">
    <div class="squarebig"></div>
    <div class="vertical-group">
    <div class="square1"></div>
    <div class="square2"></div>
    </div>
  </div>
  <div class="row row-middle">
    <div class="square3"></div>
    <div class="square4"></div>
    <div class="square5"></div>
 </div>
    <div class="row row-middle">
     <div class="rect"></div>
  </div>

  <!-- Нижний ряд: три квадрата равномерно -->
  <div class="row row-bottom">
  <div class="square6"></div>
  </div>
</div>
    

</body>
</html>
