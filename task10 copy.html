<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Красный квадрат</title>
    <style>
/* Контейнер для сетки */
.grid-container {
  display: grid;
  /* Создает ровно 3 колонки одинаковой ширины */
  grid-template-columns: repeat(3, 1fr); 
  /* Расстояние между квадратами */
  gap: 20px; 
  /* Ограничим максимальную ширину сетки, чтобы квадраты не растягивались до бесконечности */
  max-width: 600px; 
  margin: 0 auto;
}

/* Стили для квадрата */
.square {
  background-color: red; /* Красный цвет */
  border: 4px solid black; /* Выделение края (черная рамка) */
  
  /* Делает элемент квадратным: высота всегда равна ширине */
  aspect-ratio: 1 / 1; 
}
    </style>
</head>
<body>
<div class="grid-container">
  <div class="square"></div>
  <div class="square"></div>
  <div class="square"></div>
  <div class="square"></div>
  <div class="square"></div>
  <div class="square"></div>
</div>
</body>
</html>
