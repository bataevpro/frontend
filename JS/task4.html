<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прыгающий квадрат</title>
    <style>
        #square {
            width: 50px;
            height: 50px;
            background-color: black;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="square"></div>

    <script>
        // Создаём квадрат и настраиваем его
        const square = document.createElement('div');
        square.style.left = (window.innerWidth / 2 - square.offsetWidth / 2) + 'px';
        square.style.top = (window.innerHeight / 2 - square.offsetHeight / 2) + 'px';
        square.style.backgroundColor = 'black';
        document.body.appendChild(square);

        let velocity = 0; // Вертикальная скорость
        let gravity = 0.5; // Сила тяжести

        // Обработчик нажатия клавиши
        document.addEventListener('keydown', (event) => {
            if (event.key === ' ' || event.key === 'Пробел') {
                velocity = -30; // Запускаем прыжок вверх
            }
        });

        // Цикл анимации
        const intervalId = setInterval(() => {
            velocity += gravity; // Применяем гравитацию
            square.style.top = (window.innerHeight / 2 - square.offsetHeight / 2) + velocity + 'px';

            // Проверка на столкновение с полом (нижняя граница окна)
            if (square.offsetTop + square.offsetHeight > window.innerHeight - 100) {
                clearInterval(intervalId); // Остановка анимации
                velocity = 0; // Остановка скорости после прыжка
            }
        }, 1000 / 120); // Частота кадров
    </script>
</body>
</html>
