<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фигуры в одну строку</title>
    <style>
     .line {
        display: flex;
        margin: 10px;
    }
     .square1 {

          width: 50px;
          height: 50px;
          background-color: blue;
          border: 5px solid green;
          padding: 10px;
        }
       .square2 {
          width: 50px;
          height: 50px;
          background-color: red;
          border: 5px solid green;
        }
       .square3 {
          width: 50px;
          height: 50px;
          background-color: orange;
          border: 5px solid green;

        }
       .square4 {

          width: 20px;
          height: 20px;
          background-color: yellow;
          
        }
    </style>
</head>
<body>
  <div class="line">
    <div class="square1">
       <div class="square4"></div> 
    </div>     
    <div class="square2"></div>  
    <div class="square3"></div> 
</div>  
<div class="line">
    <div class="square1"></div>     
    <div class="square2"></div>  
    <div class="square3"></div> 
</div> 
</body>
</html>
