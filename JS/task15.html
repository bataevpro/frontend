<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фигуры в одну строку</title>
    <style>
    .fullscreen-square {
    
          width: 200px;
          height: 200px;
          background-color: gray;
          padding: 20px;
          
          
         display: flex;
        flex-direction: column;
        justify-content: space-between;
        margin-left: 400px;
        margin-right: 400px;
}
        
     .row {
  display: flex;
  width: 100%; 
   
}
        
.row-top {
  justify-content: space-between;
}
    
.row-middle {
  justify-content: center;
}
.row-bottom {
  justify-content: space-between;
}

        .square1 {

          width: 60px;
          height: 60px;
          background-color: red;
          
        }
    .square2 {

          width: 60px;
          height: 60px;
          background-color: blue;
          
        }
    .square3 {

          width: 200px;
          height: 40px;
          background-color: green;
          
        }
    .square4 {

          width: 60px;
          height: 60px;
          background-color: yellow;
          
        }
    .square5 {

          width: 60px;
          height: 60px;
          background-color: yellow;
          
        }
    .square6 {

          width: 60px;
          height: 60px;
          background-color: yellow;
          
        }
</style>
</head>
<body>
  <div class="fullscreen-square">
       <div class="row row-top">
       <div class="square1"></div> 
       <div class="square2"></div> 
   </div> 
     <div class="row row-middle">
   <div class="square3"></div> 
   </div>   
   <div class="row row-bottom">
   <div class="square4"></div> 
   <div class="square5"></div> 
   <div class="square6"></div> 
</div>

</body>
</html>
