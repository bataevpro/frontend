<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фигуры в одну строку</title>
    <style>
         .grid-container {
             display: grid;
             grid-template-columns: repeat(3, 1fr); 
             gap: 10px; 
             max-width: 15px; 
             margin-right: 20px;
             margin-left: 20px;
             margin-bottom: 40px;
             margin: 20px;
             padding: 10px;
    }   
         .column-container {
             display: flex;
             flex-direction: column;
             gap: 10px; 
            padding: 10px;         
}   
         .row-container {
             display: flex;
            flex-direction: row;
            align-items: center; 
            gap: 10px;   
            margin: 10px 20px;
            padding: 10px;
}    

       .red-circle {
            background-color: blue;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid black;
        }

        .blue-square {
            background-color:  red;
            width: 100px;
            height: 100px;
            border: 4px solid black;
        }
        .green-rectangle {
            background-color: green;
            width: 150px;
            height: 100px;
            border: 4px solid black;
        }
      .yellow-circle {
            background-color: yellow;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid black;
        }

        .orange-square2 {
            background-color:  orange;
            width: 50px;
            height: 50px;
            border: 4px solid black;
        }
         .orange-square1 {
            background-color:  orange;
            width: 50px;
            height: 50px;
            border: 4px solid black;
        }
        .purple-rectangle {
            background-color: purple;
            width: 150px;
            height: 100px;
            border: 4px solid black;
        }
       .yellow-circle {
            background-color: yellow;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid black;
        }
       .blue-circle {
            background-color: blue;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid black;
        }
        .greenyellow-square4 {
            background-color:  greenyellow;
            width: 100px;
            height: 100px;
            border: 4px solid black;
        }
         .green-square3 {
            background-color:  green;
            width: 100px;
            height: 100px;
            border: 4px solid black;
        }
        .pink-rectangle {
            background-color: pink;
            width: 150px;
            height: 100px;
            border: 4px solid black;
    </style>
</head>
<body>

     <div class="grid-container">
        <div class="box blue-square"></div>
        <div class="box red-circle"></div>
        <div class="green-rectangle"></div>
        <div class="purple-rectangle"></div>
    <div class="column-container">
        <div class="orange-square1"></div>
        <div class="orange-square2"></div>
       </div>
        <div class="yellow-circle"></div>
    </div>
        <div class="row-container">
        <div class="pink-rectangle"></div>
        <div class="green-square3"></div>
        <div class="blue-circle"></div>
        <div class="greenyellow-square4"></div>
    
    </div>
  
</body>
</html>
